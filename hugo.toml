# cfworx.tech Hugo configuration
# Docs: https://gohugo.io/getting-started/configuration/

baseURL  = "https://cfworx.tech/"
title    = "CFWorx"
timeZone = "America/Los_Angeles"
# (The page language is the lang="en" attribute in layouts/_default/baseof.html;
# the old languageCode config key is deprecated in Hugo 0.158+ and unused here.)

# Generate robots.txt from layouts/robots.txt
enableRobotsTXT = true

# No tags/taxonomies for now; sections (notes, homelab, tools, games)
# are the organizing structure. Delete this line later if you ever want tags.
disableKinds = ["taxonomy", "term"]

[params]
  # Top-level folders, in the order they appear in My Computer, in the
  # folder tree and in llms.txt. Adding one later = create
  # content/<slug>/_index.md, then add the slug here. (To give it a
  # desktop icon too, add a line to layouts/partials/desktop-items.html.)
  sectionOrder = ["notes", "homelab", "tools", "games"]
  tagline     = "Cory's Desktop"
  description = "Cory's corner of the web: IT notes and labs, practice tools, games, and whatever else I'm into."
  author      = "Cory"
  email       = "p3@cfworx.tech"

[markup]
  # Table of contents for lab posts (layouts/_default/single.html):
  # built from the ## and ### headings.
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false
  [markup.goldmark.renderer]
    # Keep raw HTML in Markdown disabled (safer default).
    unsafe = false
  [markup.highlight]
    # Class-based syntax highlighting -> colors live in CSS, zero inline styles,
    # which keeps the strict Content-Security-Policy happy.
    noClasses   = false
    guessSyntax = false
    lineNos     = false

# The home page is also rendered as /llms.txt, /llms-full.txt and
# /index.json (the search index).
# To turn RSS on someday, add "RSS" to the home list below.
[outputs]
  home    = ["HTML", "LLMS", "LLMSFULL", "SearchIndex"]
  section = ["HTML"]
  page    = ["HTML"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType   = "text/plain"
    baseName    = "llms"
    isPlainText = true
  [outputFormats.LLMSFULL]
    mediaType   = "text/plain"
    baseName    = "llms-full"
    isPlainText = true
  [outputFormats.SearchIndex]
    mediaType   = "application/json"
    baseName    = "index"
    isPlainText = true

[sitemap]
  changefreq = "weekly"
  priority   = 0.5
