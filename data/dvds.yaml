# Your DVD and Blu-ray collection, shown at /tools/dvds/ (DVD Tracker).
#
# This file is the whole collection; the page itself is read-only.
# One title per line, in any order: the tracker does its own sorting.
# Add a line, commit, push. The page updates when Cloudflare rebuilds.
#
#   title    required, always in double quotes
#   year     release year; it tells remakes apart (Red Dawn 1984 vs 2012)
#   format   dvd | bluray | 4k   (own it on both? give each copy its own
#            line, so each one keeps its own location)
#   location where it lives, in quotes: "hdd01" for a DVD ripped to the
#            first media drive (the disc itself goes in a box), "shelf"
#            for discs that stay on the shelf (Blu-rays). Any label works.
#   type     leave it out for movies; tv for a season or box set
#   kids     true for kids' titles (the Kid's Movies / Kid's TV Shows folders)
#   seasons  TV only, in quotes: "1", "1-3" or "1, 4"
#   notes    anything else worth knowing; the search reads it
#   added    date it joined the collection, "YYYY-MM-DD"; drives
#            the "Recently added" sort
#
# Example:
#   - { title: "Skyfall", year: 2012, format: bluray, location: "shelf", added: "2026-10-23" }
#
# This list started from the rips on the media drive, hdd01 (October
# 2026). Every rip there is DVD-sized, so everything below started as
# dvd; change any that are really Blu-ray.

