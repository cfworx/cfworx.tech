# Staff picks, for the DVD Tracker's "Staff picks" tab (/tools/dvds/):
# films you'd likely enjoy, going by what's already in data/dvds.yaml.
#
# A pick you own (same title and year in dvds.yaml, any format) drops
# off the shelf by itself, and so does anything on the Hunt list; you
# never need to delete lines here. Add shelves or films any time.
#
#   shelf    the shelf's name
#   because  titles from your collection this shelf is based on (only
#            the ones you own are shown, so it's fine to list extras)
#   films    { title: "...", year: 2004 }

