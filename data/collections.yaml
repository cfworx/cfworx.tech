# Series and collections, for the DVD Tracker's Hunt list (/tools/dvds/).
#
# The tracker compares each series with data/dvds.yaml. A series you own
# at least one film of, but not all, shows on the Hunt list with the
# films still to find. Once you own every film it moves to "Complete";
# a series you own none of isn't shown. Nothing here needs updating when
# you buy a film: add it to dvds.yaml as usual and it's ticked off.
#
# A film counts as owned when dvds.yaml has the same title (case,
# punctuation and a leading "The" don't matter) and the same year, in
# any format.
#
#   name    the series, as shown on the Hunt list
#   films   in watching order: { title: "...", year: 2001 }
#   show    for a TV series instead of films:
#           { title: "...", year: <first aired>, seasons: <how many> }
#           Seasons owned come from the "seasons" field in dvds.yaml.
#
# Only films that are already out are listed; add new ones as they're
# released.

