{{- /* Desktop icons. Real links that open with one click, so they work
       without JavaScript; with it, desktop.js also lets them be dragged
       into the Recycle Bin. */ -}}
<nav class="desktop-icons" aria-label="Desktop">
  {{- range partial "desktop-items.html" . }}
  {{- if .app }}
  <button class="dicon" type="button" data-cmd="{{ .app }}" hidden><img src="/icons/{{ .icon }}-32.png" alt="" width="32" height="32"><span>{{ .label }}</span></button>
  {{- else }}
  <a class="dicon" draggable="false" href="{{ .url }}"{{ if .ext }} target="_blank" rel="noopener noreferrer"{{ end }}><img src="/icons/{{ .icon }}-32.png" alt="" width="32" height="32" draggable="false"><span>{{ .label }}</span></a>
  {{- end }}
  {{- end }}
</nav>
