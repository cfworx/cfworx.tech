<header class="site-header">
  {{- $glyph := `<svg class="rj45" viewBox="0 0 32 32" width="19" height="19" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M6 5h20v22h-5v-4H11v4H6z"/><g stroke="currentColor" stroke-width="1.6"><path d="M9.5 5v8"/><path d="M12.1 5v8"/><path d="M14.7 5v8"/><path d="M17.3 5v8"/><path d="M19.9 5v8"/><path d="M22.5 5v8"/></g></svg>` -}}
  {{- if .IsHome }}
  <h1 class="site-title"><a href="/">{{ $glyph | safeHTML }}CFWorx</a></h1>
  {{- else }}
  <p class="site-title"><a href="/">{{ $glyph | safeHTML }}CFWorx</a></p>
  {{- end }}
  <p class="tagline">{{ site.Params.tagline }}</p>
  <nav aria-label="Site">
    <a href="/"{{ if .IsHome }} aria-current="page"{{ end }}>home</a>
    <a href="/tools/"{{ if eq .Section "tools" }} aria-current="page"{{ end }}>tools</a>
    <a href="/about/"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>about</a>
    <button id="theme-toggle" class="theme-toggle" type="button" hidden
      aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a7 7 0 0 0 10.6 10.6z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></g></svg>
    </button>
  </nav>
</header>
