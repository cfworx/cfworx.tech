{{- /* External links (anything with a scheme, e.g. https://...) open in
       a new tab; site-internal links stay in the same tab. */ -}}
{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if or (eq $u.Scheme "http") (eq $u.Scheme "https") }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text }}</a>
{{- /* keep this file whitespace-tight: trailing newlines here would
       add stray spaces after every link */ -}}
