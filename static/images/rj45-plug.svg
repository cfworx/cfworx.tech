<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 28">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f2f2ec"/>
      <stop offset="1" stop-color="#dcdcd3"/>
    </linearGradient>
  </defs>
  <!-- latch arm: pivots at the front, angles back under the body -->
  <path d="M47 21 L33 21 L26 26.5 L40 26.5 Z" fill="#c6c6bd" stroke="#8b8b82" stroke-width="1"/>
  <!-- blue strain-relief boot where the cable enters -->
  <path d="M8 9.5 Q15 8 18 6.5 L18 21.5 Q15 20 8 18.5 Z" fill="#0057b8"/>
  <!-- clear plastic body, stepped at the top front where the pins sit -->
  <path d="M20 4.5 Q20 2.5 22 2.5 L36 2.5 L38 4.5 L52 4.5 Q54 4.5 54 6.5 L54 19 Q54 21 52 21 L22 21 Q20 21 20 19 Z"
        fill="url(#plastic)" stroke="#7d7d76" stroke-width="1.5"/>
  <!-- cable stub seen through the plastic -->
  <rect x="21.5" y="10" width="12" height="6" rx="3" fill="#0057b8" opacity="0.45"/>
  <!-- gold contact pins, seated in the front step -->
  <g stroke="#d9a821" stroke-width="1.8" stroke-linecap="butt">
    <line x1="40" y1="5.3" x2="40" y2="11.5"/>
    <line x1="43.5" y1="5.3" x2="43.5" y2="11.5"/>
    <line x1="47" y1="5.3" x2="47" y2="11.5"/>
    <line x1="50.5" y1="5.3" x2="50.5" y2="11.5"/>
  </g>
  <!-- gloss line along the top of the body -->
  <path d="M22.5 4.2 L35 4.2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
</svg>
